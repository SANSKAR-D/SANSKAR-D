<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Sanskar Gupta — CSE undergrad, C++ and AI systems" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="55%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panel">
      <rect x="0" y="0" width="1000" height="220" rx="14"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1000" height="220" rx="14" fill="#0d1117"/>

  <g clip-path="url(#panel)">
    <!-- grid -->
    <g stroke="#21262d" stroke-width="1">
      <path d="M0 55 H1000 M0 110 H1000 M0 165 H1000"/>
      <path d="M125 0 V220 M250 0 V220 M375 0 V220 M500 0 V220 M625 0 V220 M750 0 V220 M875 0 V220"/>
    </g>

    <!-- rating curve, draws itself once -->
    <path id="rating"
          d="M40 176 L110 162 L180 170 L250 143 L320 152 L390 127 L460 136 L530 109 L600 119 L670 93 L740 101 L810 74 L880 83 L950 56"
          fill="none" stroke="url(#curve)" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="1300" stroke-dashoffset="1300" opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="1300" to="0" dur="3.2s" begin="0.3s" fill="freeze"/>
    </path>

    <!-- travelling node -->
    <circle r="4.5" fill="#7ee787" filter="url(#glow)" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0.9" dur="3.5s" begin="0.3s" fill="freeze"/>
      <animateMotion dur="3.2s" begin="0.3s" fill="freeze"
                     path="M40 176 L110 162 L180 170 L250 143 L320 152 L390 127 L460 136 L530 109 L600 119 L670 93 L740 101 L810 74 L880 83 L950 56"/>
    </circle>
    <circle cx="950" cy="56" r="4.5" fill="#7ee787" filter="url(#glow)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="3.5s" fill="freeze"/>
      <animate attributeName="r" values="4.5;7;4.5" dur="2.4s" begin="3.5s" repeatCount="indefinite"/>
    </circle>

    <!-- left fade so text stays legible over the grid -->
    <rect x="0" y="0" width="620" height="220" fill="url(#fade)"/>
  </g>

  <!-- name -->
  <text x="48" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="40" font-weight="700" fill="#e6edf3" letter-spacing="1">
    Sanskar Gupta
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0s" fill="freeze"/>
  </text>

  <!-- cycling subtitle -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#8b949e">
    <text x="48" y="122" opacity="0">
      C++ · competitive programming · Codeforces
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.29;0.33;1"
               dur="10.5s" begin="0.9s" repeatCount="indefinite"/>
    </text>
    <text x="48" y="122" opacity="0">
      LLM pipelines · RAG · agent graphs
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.29;0.33;1"
               dur="10.5s" begin="4.4s" repeatCount="indefinite"/>
    </text>
    <text x="48" y="122" opacity="0">
      real-time backends · Docker · Postgres
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.29;0.33;1"
               dur="10.5s" begin="7.9s" repeatCount="indefinite"/>
    </text>
    <rect x="48" y="108" width="9" height="18" fill="#58a6ff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.9;0;0" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="x" values="48;330;48" keyTimes="0;0.3;1" dur="10.5s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- footer line -->
  <text x="48" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="13" fill="#484f58">
    MNNIT Allahabad · CSE '29
  </text>

  <rect x="0.5" y="0.5" width="999" height="219" rx="14" fill="none" stroke="#30363d"/>
</svg>
