<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue Bar -->
  <rect x="2" y="12" width="3" height="8" fill="#4285F4">
    <animate attributeName="y" values="12; 4; 12" dur="1s" repeatCount="indefinite" begin="0s" />
    <animate attributeName="height" values="8; 16; 8" dur="1s" repeatCount="indefinite" begin="0s" />
  </rect>
  
  <!-- Green Bar -->
  <rect x="7" y="12" width="3" height="8" fill="#34A853">
    <animate attributeName="y" values="12; 6; 12" dur="1.2s" repeatCount="indefinite" begin="0.2s" />
    <animate attributeName="height" values="8; 14; 8" dur="1.2s" repeatCount="indefinite" begin="0.2s" />
  </rect>
  
  <!-- Yellow Bar -->
  <rect x="12" y="12" width="3" height="8" fill="#FBBC05">
    <animate attributeName="y" values="12; 8; 12" dur="0.8s" repeatCount="indefinite" begin="0.4s" />
    <animate attributeName="height" values="8; 12; 8" dur="0.8s" repeatCount="indefinite" begin="0.4s" />
  </rect>
  
  <!-- Red Bar -->
  <rect x="17" y="12" width="3" height="8" fill="#EA4335">
    <animate attributeName="y" values="12; 2; 12" dur="1.5s" repeatCount="indefinite" begin="0.6s" />
    <animate attributeName="height" values="8; 18; 8" dur="1.5s" repeatCount="indefinite" begin="0.6s" />
  </rect>
</svg>
