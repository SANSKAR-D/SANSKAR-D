<svg width="40" height="20" viewBox="0 0 40 20" xmlns="http://www.w3.org/2000/svg">
  <!-- Left Star -->
  <circle cx="10" cy="10" r="2" fill="#FAD02C">
    <animate attributeName="r" values="1;3;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Center Star -->
  <circle cx="20" cy="8" r="2.5" fill="#FAD02C">
    <animate attributeName="r" values="1.5;3.5;1.5" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Right Star -->
  <circle cx="30" cy="10" r="2" fill="#FAD02C">
    <animate attributeName="r" values="1;3;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Connecting Line -->
  <path d="M10 10 L20 8 L30 10" fill="none" stroke="#FAD02C" stroke-width="1" opacity="0.6" />
</svg>
